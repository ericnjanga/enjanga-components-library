query blogPostEntryQuery {
  blogPost(id: "6CYpnNFqeIPAZoMFmzLFmB") {
    sys {
      id
    }
    # add the fields you want to query
    title
    slug
    businessDomain
    techstack
    introVideo {
      url
      contentType
      fileName
      size
      width
      height
      title
      description
    }
    introVideoImage {
      url
      contentType
      fileName
      size
      width
      height
      title
      description
    }
  }
}